<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ops Defender - Live Monitor</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: #4CAF50;
            margin-bottom: 10px;
        }
        .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        .status.connected {
            background: #4CAF50;
            color: white;
        }
        .status.disconnected {
            background: #f44336;
            color: white;
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        .metric-card {
            background: #2a2a2a;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .metric-label {
            font-size: 14px;
            color: #999;
            margin-bottom: 8px;
        }
        .metric-value {
            font-size: 32px;
            font-weight: bold;
            color: #4CAF50;
        }
        .metric-value.warning {
            color: #ff9800;
        }
        .metric-value.danger {
            color: #f44336;
        }
        .events-panel {
            background: #2a2a2a;
            border-radius: 8px;
            padding: 20px;
            margin-top: 30px;
            max-height: 400px;
            overflow-y: auto;
        }
        .events-panel h2 {
            margin-top: 0;
            color: #4CAF50;
        }
        .event {
            background: #1a1a1a;
            border-left: 4px solid #f44336;
            padding: 12px;
            margin: 10px 0;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }
        .event-time {
            color: #999;
            font-size: 11px;
        }
        .event-ip {
            color: #ff5722;
            font-weight: bold;
        }
        .event-reason {
            color: #ffc107;
        }
        .config-section {
            background: #2a2a2a;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .config-section input {
            background: #1a1a1a;
            border: 1px solid #444;
            color: #e0e0e0;
            padding: 8px;
            border-radius: 4px;
            width: 300px;
            margin-right: 10px;
        }
        .config-section button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
        }
        .config-section button:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛡️ Ops Defender - Live Monitor</h1>
        <span id="connectionStatus" class="status disconnected">DISCONNECTED</span>

        <div class="config-section">
            <label>Defender URL:</label>
            <input type="text" id="defenderUrl" value="http://localhost:8080" placeholder="http://localhost:8080">
            <button onclick="connect()">Connect</button>
        </div>

        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-label">Active IPs</div>
                <div class="metric-value" id="activeIPs">-</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Blocked IPs</div>
                <div class="metric-value" id="blockedIPs">-</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Total Requests</div>
                <div class="metric-value" id="totalRequests">-</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Blocked Requests</div>
                <div class="metric-value" id="blockedRequests">-</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Dropped IPs</div>
                <div class="metric-value" id="droppedIPs">-</div>
            </div>
        </div>

        <div class="events-panel">
            <h2>🚫 Recent Block Events</h2>
            <div id="blockLog"></div>
        </div>
    </div>

    <script>
        let eventSource = null;

        function connect() {
            const url = document.getElementById('defenderUrl').value;
            
            // Close existing connection
            if (eventSource) {
                eventSource.close();
            }

            // Connect to SSE endpoint
            eventSource = new EventSource(url + '/events');
            
            eventSource.onopen = function() {
                document.getElementById('connectionStatus').textContent = 'CONNECTED';
                document.getElementById('connectionStatus').className = 'status connected';
            };

            eventSource.onerror = function() {
                document.getElementById('connectionStatus').textContent = 'DISCONNECTED';
                document.getElementById('connectionStatus').className = 'status disconnected';
            };

            eventSource.onmessage = function(event) {
                const data = JSON.parse(event.data);
                console.log('Event received:', data);
                
                if (data.type === 'connected') {
                    console.log('Connected to Ops Defender');
                }
                
                if (data.type === 'stats_update') {
                    updateStats(data.data);
                }
                
                if (data.type === 'ip_blocked') {
                    addBlockEvent(data);
                }
            };
        }

        function updateStats(stats) {
            document.getElementById('activeIPs').textContent = formatNumber(stats.active_ips);
            document.getElementById('blockedIPs').textContent = formatNumber(stats.blocked_ips);
            document.getElementById('totalRequests').textContent = formatNumber(stats.total_requests);
            document.getElementById('blockedRequests').textContent = formatNumber(stats.blocked_requests);
            document.getElementById('droppedIPs').textContent = formatNumber(stats.dropped_ips);

            // Update colors based on thresholds
            const blockedIPsEl = document.getElementById('blockedIPs');
            if (stats.blocked_ips > 100) {
                blockedIPsEl.className = 'metric-value danger';
            } else if (stats.blocked_ips > 50) {
                blockedIPsEl.className = 'metric-value warning';
            } else {
                blockedIPsEl.className = 'metric-value';
            }
        }

        function addBlockEvent(event) {
            const log = document.getElementById('blockLog');
            const eventDiv = document.createElement('div');
            eventDiv.className = 'event';
            
            const time = new Date(event.timestamp).toLocaleTimeString();
            eventDiv.innerHTML = `
                <div class="event-time">${time}</div>
                <div>IP: <span class="event-ip">${event.data.ip}</span></div>
                <div>Reason: <span class="event-reason">${event.data.reason}</span></div>
                <div>URI: ${event.data.uri}</div>
            `;
            
            log.insertBefore(eventDiv, log.firstChild);
            
            // Keep only last 20 events
            while (log.children.length > 20) {
                log.removeChild(log.lastChild);
            }
        }

        function formatNumber(num) {
            if (num >= 1000000) {
                return (num / 1000000).toFixed(1) + 'M';
            } else if (num >= 1000) {
                return (num / 1000).toFixed(1) + 'K';
            }
            return num.toString();
        }

        // Auto-connect on page load
        window.onload = function() {
            connect();
        };
    </script>
</body>
</html>
